name: Release
on:
    push:
        tags: ['v[0-9]*']

permissions:
    contents: read

jobs:
    verify:
        uses: ./.github/workflows/ci.yml
    publish:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            VERSION: ${{ github.ref_name }}
            LOAF_BUILD_TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: '1.27.3'
            - name: Validate release version
              shell: bash
              run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
            - name: Build archives and download checksums
              run: bash scripts/build.sh
            - name: Attest archive provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                  subject-path: |
                      dist/loaf_${{ github.ref_name }}_*.tar.gz
                      dist/loaf_${{ github.ref_name }}_*.zip
            - name: Publish the tagged release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  options=()
                  if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
                  gh release create "$VERSION" --verify-tag --title "Loaf $VERSION" \
                      --generate-notes "${options[@]}" \
                      dist/loaf_"${VERSION}"_*.tar.gz dist/loaf_"${VERSION}"_*.zip "dist/loaf_${VERSION}_checksums.txt"
