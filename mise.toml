[tools]
go = "1.27.1"

[tasks.fmt]
description = "Format Go source with four-space indentation"
run = "go run ./scripts/format.go"

[tasks.check]
description = "Run formatting, unit, static, and race checks"
run = "bash scripts/check.sh"

[tasks.build]
description = "Build embedded Linux runners and the local CLI archive"
run = "bash scripts/build.sh"

[tasks.integration]
description = "Test real SSH and detached processes in an isolated Linux container"
run = "bash scripts/integration.sh"
